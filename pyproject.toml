[project]
name = "rl-space-invaders"
version = "0.1.0"
description = "Agentes de aprendizaje por refuerzo (PPO y DQN) entrenados sobre un Space Invaders propio, con enfoques vectorial y basado en vision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "pygame>=2.6.1",
    "scipy>=1.17.1",
    "stable-baselines3[extra]>=2.7.1",
    "tensorboard>=2.20.0",
]
